[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "yt-to-notion"
version = "1.0.0"
description = "Transcribe YouTube lectures and save structured notes to Notion"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=0.6.3",
    "groq>=0.9.0",
    "notion-client>=2.2.1",
    "yt-dlp>=2024.1.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0"]

[project.scripts]
yt-to-notion = "yt_to_notion.cli:main"
